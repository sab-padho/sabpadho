<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f5f4fa" />
    <title>SabPadho Admin</title>
    <script>
      // Apply the saved theme before paint so the portal never flashes the wrong palette.
      ;(function () {
        try {
          var saved = localStorage.getItem('sabpadho-theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = saved === 'dark' || (saved === 'system' && prefersDark)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.classList.toggle('light', !dark)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#090812' : '#f5f4fa')
        } catch (e) {}
      })()
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
